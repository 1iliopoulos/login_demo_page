<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Login Page</title>
</head>
<style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --font: Tahoma;
            --boxradius: 10px;
            --textcolor: White; /* Χρώμα κειμένου */
            --text-button-color: black;
            --button-color: white;
            --button-opacity: 0.75;
            --buttonradius: 3px;
            --button-text-size: 12pt;
            
        }

        html, body {
            height: 100%;
            width: 100%;
            font-family: var(--font);
        }

        .full-page-image {
            background-image: url('./img.jpg'); /* Εδώ βάζεις τη διαδρομή προς την εικόνα σου */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-form {
            background-color: rgba(0, 0, 0, .7);
            max-width: 350px;
            width: 100%;
            height: auto;
            border: 0px;
            border-radius: var(--boxradius);
            padding: 50px;
            margin: 20px;
            align-items: center;
            margin: 0;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .form {
            display: inline-block;
            width: 100%;
        }

        .form input {
            outline: none;
            border-width: 0 0 2px;
            border-color: white;
            color: var(--textcolor);
            background-color: transparent;
            padding: 4px;
            margin-bottom: 10px;
            width: 100%;
            height: 20px;
            font-size: 10pt;
            outline-width: 0;
        }        

        .button {
            background-color: var(--button-color);
            border-radius: var(--buttonradius);
            color: var(--text-button-color);
            font-size: var();
            font-weight: bold;
            border: 0px;
            width: 100%;
            height: calc(var(--button-text-size) + 15px);
            margin-top: 6px;
        }

        .button:hover {
            background-color: hwb(from var(--button-color) h w b / var(--button-opacity));
            color: hwb(from var(--button-text-color) h w b / var(--button-opacity));
            cursor: pointer;
        }

        .button:active {
            background-color: hwb(from var(--button-color) h w b / calc(var(--button-opacity) - 0.10));
        }

</style>
<body>
    <div class="full-page-image"></div>
    <div class="login-form">
        
        <form>
            
            <section class="form"> 
                    
                    <div> <input type="text" placeholder="Username" maxlength="10" required/> </div>
                    
                    <div> <input type="password" placeholder="Password" maxlength="10" required/> </div>
                        
                    <div> <button class="button" type="submit">Login</button> </div>

            </section>
        
        </form>
    
    </div>
</body>
</html>
